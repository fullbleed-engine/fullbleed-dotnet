name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-and-tests:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            file: fullbleed_dotnet_native.dll
          - os: ubuntu-latest
            rid: linux-x64
            file: libfullbleed_dotnet_native.so
          - os: macos-15-intel
            rid: osx-x64
            file: libfullbleed_dotnet_native.dylib
          - os: macos-15
            rid: osx-arm64
            file: libfullbleed_dotnet_native.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out .NET bindings
        uses: actions/checkout@v4
        with:
          path: fullbleed-dotnet

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the independently versioned CLI for integration tests
        run: python -m pip install fullbleed==2.5.8

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Verify pinned dependencies and retained license texts
        working-directory: fullbleed-dotnet
        run: python tools/native_provenance.py --check

      - name: Check Rust formatting
        shell: pwsh
        working-directory: fullbleed-dotnet
        run: cargo fmt --manifest-path native/fullbleed-dotnet-native/Cargo.toml -- --check

      - name: Build and stage native runtime
        shell: pwsh
        working-directory: fullbleed-dotnet
        run: ./scripts/build-native.ps1 -Rid '${{ matrix.rid }}'

      - name: Test native bridge
        shell: pwsh
        working-directory: fullbleed-dotnet
        run: cargo test --locked --manifest-path native/fullbleed-dotnet-native/Cargo.toml

      - name: Lint native bridge
        shell: pwsh
        working-directory: fullbleed-dotnet
        run: cargo clippy --locked --manifest-path native/fullbleed-dotnet-native/Cargo.toml --all-targets -- -D warnings

      - name: Check managed formatting
        shell: pwsh
        working-directory: fullbleed-dotnet
        run: dotnet format FullBleed.DotNet.sln --verify-no-changes

      - name: Build managed solution and samples
        shell: pwsh
        working-directory: fullbleed-dotnet
        run: dotnet build FullBleed.DotNet.sln -c Release

      - name: Test managed bindings
        shell: pwsh
        working-directory: fullbleed-dotnet
        env:
          FULLBLEED_REQUIRE_CLI: '1'
        run: dotnet test tests/FullBleed.DotNet.Tests/FullBleed.DotNet.Tests.csproj -c Release --no-build

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: fullbleed-dotnet/runtimes/${{ matrix.rid }}/native/${{ matrix.file }}
          if-no-files-found: error

  package:
    needs: native-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out .NET bindings
        uses: actions/checkout@v4
        with:
          path: fullbleed-dotnet

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: fullbleed-dotnet/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: fullbleed-dotnet/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: fullbleed-dotnet/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: fullbleed-dotnet/runtimes/osx-arm64/native

      - name: Pack NuGet artifacts
        working-directory: fullbleed-dotnet
        run: dotnet pack src/FullBleed.DotNet/FullBleed.DotNet.csproj -c Release -o artifacts/packages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify package contents and native provenance
        working-directory: fullbleed-dotnet
        run: python tools/verify_package.py --all-rids

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: fullbleed-dotnet/artifacts/packages/*
          if-no-files-found: error

  package-consumer:
    name: Package consumer ${{ matrix.platform.rid }} .NET ${{ matrix.dotnet }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0', '9.0', '10.0']
        platform:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}.x
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Consume the assembled NuGet package outside the checkout
        shell: pwsh
        run: ./scripts/package-smoke.ps1 -SkipPack -TargetFramework 'net${{ matrix.dotnet }}'
      - uses: actions/upload-artifact@v4
        with:
          name: package-consumer-${{ matrix.platform.rid }}-net${{ matrix.dotnet }}
          path: artifacts/package-smoke/*
          if-no-files-found: error

  package-evidence:
    name: Compare packaged output across platforms
    needs: package-consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF and font readers for release evidence
        run: python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 pillow==12.3.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: package-consumer-*
          path: artifacts/consumer-evidence
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - run: python tools/verify_consumer_evidence.py
        name: Verify independent fonts and text and compare PDF/PNG bytes
      - name: Compare with the previous public package and reject incorrect family selection
        run: python tools/compare_font_packages.py artifacts/consumer-evidence/package-consumer-linux-x64-net8.0
      - uses: actions/upload-artifact@v4
        with:
          name: cross-platform-evidence
          path: |
            artifacts/cross-platform-evidence.json
            artifacts/consumer-evidence/**/font-verification.json
            artifacts/consumer-evidence/**/pdfium-*/*.png
            artifacts/consumer-evidence/**/font-families/verification.json
            artifacts/consumer-evidence/**/font-families/**/pdfium-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: font-comparison
          path: |
            artifacts/font-comparison/baseline/
            artifacts/font-comparison/source-fonts/
            artifacts/font-comparison/*.json
            artifacts/font-comparison/*.txt
            artifacts/font-comparison/*.log
          if-no-files-found: error
